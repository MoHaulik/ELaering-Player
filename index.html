        // broken clip failed rather than hanging forever.
        if (nodeHasVideo && !videoReady && !videoFailed) {
          if ((performance.now() - videoLoadStart) / 1000 > VIDEO_LOAD_TIMEOUT) {
            markVideoFailed();  // faster path when frames are flowing; timer is the backstop
          } else {
            // Still buffering: keep the timeline frozen, show the loading indicator,
            // but keep the render + gaze loop alive so the play gate stays usable.
            showLoading(true);
            handleGazeInteractions(dt);
            fallbackEnvironment.rotation.y += dt * 0.05;
            renderer.render(scene, camera);
            return;
          }
        }
        if (videoReady) showLoading(false);

        // ---- MONOTONIC SCENARIO CLOCK ----
        // The clock is advanced by deltas and can only move forward: the video drives
        // it while it genuinely progresses, and wall-clock takes over the moment it
        // stalls, so a stalled/reset decoder can neither freeze nor rewind the
        // timeline. (The old code read videoElement.currentTime as absolute truth.)
        const hasVideo = nodeHasVideo && videoElement.readyState > 0;
        let advanced = 0;
        if (hasVideo && !videoElement.ended && !videoElement.paused) {
          const vt = videoElement.currentTime;
          if (vt > lastVideoTime + 0.001) { advanced = vt - lastVideoTime; videoStalledFor = 0; }
          else { videoStalledFor += dt; }
          lastVideoTime = vt;
        } else {
          videoStalledFor += dt;   // no video, blocked, stalled or past the end
        }

        if (advanced > 0) nodeTimer += advanced;
        else if (videoStalledFor > VIDEO_STALL_GRACE) nodeTimer += dt;

        // The clip is running now, so the manual play gate has done its job.
        if (advanced > 0) clearPlayGate();

        currentTime = nodeTimer;

        // Toggle overlay visibility along the timeline
        overlaysGroup.children.forEach(child => {
          if (child.userData.isOverlay && child.userData.startTime !== undefined) {
            child.visible = currentTime >= child.userData.startTime && currentTime <= child.userData.endTime;
          }
        });

        // Narration (§1_12A/B) — fires once, at its authored start time.
        if (!narrationPlayed && currentNode.narration && currentNode.narration.file &&
            currentTime >= (currentNode.narration.startTime || 0)) {
          narrationPlayed = true;
          try { narrationAudio.currentTime = 0; narrationAudio.play(); } catch (e) {}
        }

        // Auto-advance / terminate. The always-present exit affordance, waypoints and
        // the "hear again" button must NOT count as a pending answer, or a node could
        // never auto-advance while any of them are on screen (§4.4, §1_13, §1_12C).
        const choicesPending = activeChoices.some(c => c.userData.choiceData &&
          !(c.userData.choiceData.__exit || c.userData.choiceData.__waypoint || c.userData.choiceData.__hearAgain));

        // Termination: a video node ends on the real 'ended' event (or, for a video
        // whose duration is unknown, never on a duration fallback — §4.3); a non-video
        // node ends when its authored duration elapses.
        let ended;
        if (nodeHasVideo && !videoFailed) {
          const vdur = videoElement.duration;
          ended = videoElement.ended || (isFinite(vdur) && vdur > 0 && currentTime >= vdur);
        } else {
          ended = currentTime >= (parseFloat(currentNode.duration) || 10);
        }

        if (!choicesPending && ended) {
          if (currentNode.defaultNext) {
            selectChoice({ target: currentNode.defaultNext }, true); // auto_advance, self-guards
          } else if (!isTransitioning) {
            isTransitioning = true; // terminal node, no link → end instead of freezing
            fadeAndEnd();
          }
        }
      }

      tickFade(dt);
      handleGazeInteractions(dt);
      fallbackEnvironment.rotation.y += dt * 0.05;
      renderer.render(scene, camera);
    }

    function getVisibleChoices() {
      return activeChoices.filter(c => c.visible && (c.parent ? c.parent.visible : true));
    }

    function handleGazeInteractions(dt) {
      const visibleChoices = getVisibleChoices();

      // (Re)arm whenever a choice appears that was not visible last frame (§4.1).
      // Keyed on each mesh, so the answer choices appearing at questionTime re-arm
      // even though the exit affordance was already on screen.
      let appeared = false;
      visibleChoices.forEach(c => { if (!c.userData._wasVisible) appeared = true; });
      activeChoices.forEach(c => { c.userData._wasVisible = false; });
      visibleChoices.forEach(c => { c.userData._wasVisible = true; });

      if (visibleChoices.length === 0) {
        armed = false; armTimer = 0; preArmedChoice = null;
        gazeTimer = 0; lastIntersectedChoice = null;
        updateGazeProgress(0);
        return;
      }
      if (appeared) { armed = false; armTimer = 0; preArmedChoice = null; gazeTimer = 0; }

      // Robust gaze ray: straight out of the camera's world orientation (XR-safe,
      // no NDC/projection assumptions). recursive=false so progress rings (children
      // of the choice meshes) are never the hit target.
      camera.getWorldPosition(_gazeOrigin);
      camera.getWorldQuaternion(_gazeQuat);
      _gazeDir.set(0, 0, -1).applyQuaternion(_gazeQuat).normalize();
      raycaster.set(_gazeOrigin, _gazeDir);

      const intersects = raycaster.intersectObjects(visibleChoices, false);
      const intersectedChoice = intersects.length > 0 ? intersects[0].object : null;

      // Arming delay: choices are not yet selectable. A gaze may rest here, but the
      // dwell timer does not start until arming completes.
      if (!armed) {
        armTimer += dt;
        lastIntersectedChoice = intersectedChoice;
        gazeTimer = 0;
        if (armTimer >= GAZE_ARM_DELAY) {
          armed = true;
          // A choice already under the reticle at the instant of arming is "locked":
          // it must be looked away from and re-entered before it can be selected.
          preArmedChoice = intersectedChoice || null;
        }
        updateGazeProgress(0, intersectedChoice);
        return;
      }

      // Release the re-entry lock as soon as the gaze moves off the locked choice.
      if (preArmedChoice && intersectedChoice !== preArmedChoice) preArmedChoice = null;

      if (intersectedChoice && intersectedChoice !== preArmedChoice) {
        const threshold = intersectedChoice.userData.dwell || currentDwell;
        if (lastIntersectedChoice === intersectedChoice) {
          gazeTimer = Math.min(threshold, gazeTimer + dt);
          updateGazeProgress(gazeTimer / threshold, intersectedChoice);
          if (gazeTimer >= threshold) selectChoice(intersectedChoice.userData.choiceData);
        } else {
          gazeTimer = 0;
          lastIntersectedChoice = intersectedChoice;
          updateGazeProgress(0, intersectedChoice);
        }
      } else {
        // No choice, or still resting on the locked pre-armed choice.
        gazeTimer = 0;
        lastIntersectedChoice = intersectedChoice;
        updateGazeProgress(0, null);
      }
    }

    function updateGazeProgress(progress, targetMesh = null) {
      const p = Math.max(0, Math.min(1, progress));
      const progressIndicator = reticle.getObjectByName('gazeProgress');
      if (progressIndicator) {
        const s = Math.max(0.001, p);
        progressIndicator.scale.set(s, s, s);
      }
      activeChoices.forEach(child => {
        if (child.material && child.material.color) {
          if (child.userData.originalColor === undefined) child.userData.originalColor = child.material.color.getHex();
          child.material.color.setHex(child === targetMesh ? 0x3b82f6 : child.userData.originalColor);
        }
        // Radial fill on the targeted choice itself (§4.1) — an unmistakable cue that
        // a selection is building, so the learner can look away in time.
        const ring = child.getObjectByName ? child.getObjectByName('progressRing') : null;
        if (ring) {
          if (child === targetMesh && p > 0.001) {
            ring.visible = true;
            if (ring.geometry) ring.geometry.dispose();
            ring.geometry = new THREE.RingGeometry(0.34, 0.42, 44, 1, Math.PI / 2, -p * Math.PI * 2);
          } else {
            ring.visible = false;
          }
        }
      });
    }

    // === Media Generators ===
    function clearOverlays() {
      while (overlaysGroup.children.length > 0) {
        const child = overlaysGroup.children[0];
        overlaysGroup.remove(child);
        if (child.type === 'Group') child.children.forEach(c => disposeNode(c));
        else disposeNode(child);
      }
      activeChoices = [];
      gazeTimer = 0;
      lastIntersectedChoice = null;
    }

    function disposeNode(child) {
      // Choices carry a progressRing child (§4.1); dispose the whole subtree so a
      // long run stepping through many nodes doesn't leak ring geometry/materials.
      if (child.children) child.children.slice().forEach(disposeNode);
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (child.material.map) child.material.map.dispose();
        child.material.dispose();
      }
    }

    function createImagePlane(url, options = {}) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        img.onload = () => {
          const aspect = img.width / img.height;
          const baseWidth = 4;
          const scale = options.scale || 1;
          const geo = new THREE.PlaneGeometry(baseWidth * aspect * scale, baseWidth * scale);
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
          resolve(new THREE.Mesh(geo, mat));
        };
        img.onerror = () => resolve(null);
      });
    }

    function createTextPlane(text, options = {}) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const logicWidth = options.width || 512;
      const minHeight = options.height || 128;
      const fontSize = options.fontSize || 32;
      const fontWeight = options.fontWeight || 'normal';
      const pixelRatio = 3;
      const padding = 20;

      // Wrap against the authored width FIRST, on the canvas's default (pre-resize)
      // context, so the actual line count is known before we ever decide how tall
      // to make the background — measureText reports logical units regardless of
      // any later ctx.scale, so measuring now and drawing after resizing stays
      // consistent. This is the actual fix for backgrounds not scaling with text:
      // the old code always drew a fixed-height box and let long text (a multi-
      // line narration caption, a long answer) spill out past its own edges.
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const words = String(text).split(' ');
      let lines = [], line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > logicWidth - padding * 2 && n > 0) { lines.push(line); line = words[n] + ' '; }
        else line = testLine;
      }
      lines.push(line);
      const lineHeight = fontSize * 1.3;
      // Never shrink below the caller's nominal height (a one-word answer still
      // gets a comfortable minimum button size) but always grow to fit however
      // many lines the actual text needs.
      const logicHeight = Math.max(minHeight, lines.length * lineHeight + padding * 2.6);

      // Resizing the canvas resets its entire 2D context (font, transform,
      // everything) — this has to happen after measuring above, and font/align
      // have to be reapplied below, or every draw call after the first would
      // silently fall back to default (serif, black, left-aligned) text.
      canvas.width = logicWidth * pixelRatio;
      canvas.height = logicHeight * pixelRatio;
      ctx.scale(pixelRatio, pixelRatio);

      const textColor = options.textColor || 'white';
      const backgroundColor = options.backgroundColor || 'rgba(0,0,0,0.5)';
      const scale = options.scale || 1;

      ctx.fillStyle = backgroundColor;
      ctx.beginPath();
      const radius = 16;
      ctx.moveTo(radius, 0);
      ctx.lineTo(logicWidth - radius, 0);
      ctx.quadraticCurveTo(logicWidth, 0, logicWidth, radius);
      ctx.lineTo(logicWidth, logicHeight - radius);
      ctx.quadraticCurveTo(logicWidth, logicHeight, logicWidth - radius, logicHeight);
      ctx.lineTo(radius, logicHeight);
      ctx.quadraticCurveTo(0, logicHeight, 0, logicHeight - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // Optional horizontal alignment (§5.1); defaults to centre so existing
      // scenarios render unchanged.
      const align = (options.align === 'left' || options.align === 'right') ? options.align : 'center';
      const anchorX = align === 'left' ? padding : (align === 'right' ? logicWidth - padding : logicWidth / 2);
      ctx.fillStyle = textColor;
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      const startY = (logicHeight - (lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i].trim(), anchorX, startY + (i * lineHeight));

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const geometry = new THREE.PlaneGeometry((logicWidth / 256) * scale, (logicHeight / 256) * scale);
      const mesh = new THREE.Mesh(geometry, material);
      // Exposed so callers stacking multiple boxes (the question + each choice)
      // can space them using the box's REAL rendered height, not a guess.
      mesh.userData.boxWidth = (logicWidth / 256) * scale;
      mesh.userData.boxHeight = (logicHeight / 256) * scale;
      return mesh;
    }

    // === Saved results (recovery) ===
    function readSavedResults() {
      try { return JSON.parse(localStorage.getItem('lxr_results') || '[]'); }
      catch (e) { return []; }
    }

    function renderSavedResults() {
      const host = document.getElementById('saved-results');
      if (!host) return;
      const saved = readSavedResults();
      if (!saved.length) { host.innerHTML = ''; return; }
      host.innerHTML =
        '<div class="saved-title">Saved results on this headset (' + saved.length + ')</div>' +
        '<button id="download-saved" class="link-btn">Download all again</button> ' +
        '<button id="clear-saved" class="link-btn danger">Clear</button>';
      document.getElementById('download-saved').addEventListener('click', downloadSavedResults);
      document.getElementById('clear-saved').addEventListener('click', () => {
        if (!confirm('Delete the results stored on this headset?')) return;
        try { localStorage.removeItem('lxr_results'); } catch (e) {}
        renderSavedResults();
        updateStatus('Saved results cleared');
      });
    }

    function downloadSavedResults() {
      const saved = readSavedResults();
      saved.forEach((entry, i) => {
        setTimeout(() => {
          try {
            const blob = new Blob([JSON.stringify(entry.results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = entry.fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } catch (e) {}
        }, i * 350); // stagger — browsers drop rapid-fire simultaneous downloads
      });
      updateStatus('Re-downloading ' + saved.length + ' result file(s)');
    }

    function updateStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.style.display = 'block';
      statusElement.style.background = isError ? 'rgba(220, 38, 38, 0.95)' : 'rgba(17, 24, 39, 0.9)';
      setTimeout(() => { statusElement.style.display = 'none'; }, isError ? 5000 : 3000);
    }

    init();
  </script>
</body>
</html>
