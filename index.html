<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>E-Læring Quest Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- ============================================================
       DEPENDENCIES ARE VENDORED — this player makes no network request to
       any third party. Both libraries are committed under vendor/, so the
       player works on a headset with no internet and cannot be broken by a
       CDN outage or a CDN version change.

       three.js is loaded as a CLASSIC script (the UMD build), not as an ES
       module behind an <script type="importmap">. The target device is the
       Meta Quest 3, whose browser is modern Chromium and would happily run
       import maps — but the classic script is kept deliberately. It works on
       Quest 3, it removes the need for any import-map / bare-specifier setup,
       and it keeps the no-CDN, single-file guarantee intact with zero
       user-visible downside. There is no reason to churn it into ES modules.

         vendor/three.min.js   three.js r150 (MIT) — build/three.min.js
         vendor/jszip.min.js   JSZip 3.10.1 (MIT/GPLv3)
       ============================================================ -->
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/three.min.js"></script>

  <style>
    /* Same design tokens as ELaering-Builder — dark chrome, one accent, shared
       form language across the two apps rather than each inventing its own. */
    :root {
      --bg: #0b0b0d;
      --surface: #17171b;
      --surface-2: #1e1e23;
      --field-bg: #0e0e11;
      --border: #2c2c32;
      --border-soft: #232328;
      --text: #f2f2f2;
      --muted: #9a9aa2;
      --accent: #f2f2f2;
      --accent-text: #111318;
      --green: #2ea043;
      --red: #e5484d;
      --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9000; padding: 20px; box-sizing: border-box; background: var(--bg); }
    .card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 18px; padding: 28px 26px; box-shadow: var(--shadow-lg); max-width: 400px; width: 100%; text-align: center; }
    .logo-container { margin-bottom: 22px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    /* Headset scenario menu (spec ID:02_03) — folders on the headset, listed as a
       tappable main menu instead of a one-off file picker. */
    #scenario-menu { text-align: left; margin-bottom: 14px; max-height: 220px; overflow-y: auto; }
    .scenario-menu-item { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--field-bg); color: var(--text); font-weight: 600; font-size: 13.5px; cursor: pointer; }
    .scenario-menu-item:hover { border-color: var(--text); background: var(--surface-2); }
    .scenario-menu-item small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
    #open-folder-btn { width: 100%; padding: 12px; margin-top: 18px; margin-bottom: 14px; font-size: 13.5px; font-weight: 700; background: var(--accent); color: var(--accent-text); border: none; border-radius: 11px; cursor: pointer; }
    #open-folder-btn:hover { background: #fff; }
    .file-drop-area { position: relative; display: flex; flex-direction: column; align-items: center; padding: 28px 20px; border: 2px dashed var(--border-soft); border-radius: 14px; background: var(--field-bg); cursor: pointer; transition: border-color .15s, background .15s; margin: 18px 0; }
    .file-drop-area:hover { border-color: var(--text); background: var(--surface-2); }
    .file-drop-area span { font-size: 14px; font-weight: 600; color: var(--text); }
    .file-drop-area small { color: var(--muted); margin-top: 6px; font-size: 12px; }
    #file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    #session-info { font-size: 13px; color: var(--green); margin-bottom: 16px; font-weight: 600; min-height: 20px; background: rgba(46,160,67,0.12); padding: 10px; border-radius: 9px; display: none; }
    #session-info.show { display: block; }
    #start-button { padding: 14px 28px; font-size: 15px; background: var(--accent); color: var(--accent-text); border: none; border-radius: 12px; cursor: pointer; transition: background .15s; font-weight: 700; width: 100%; }
    #start-button:hover:not(:disabled) { background: #fff; }
    #start-button:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
    #preview-button { margin-top: 10px; padding: 12px 24px; font-size: 13.5px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border-soft); border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; transition: background .15s; }
    #preview-button:hover:not(:disabled) { background: var(--field-bg); }
    #preview-button:disabled { color: var(--muted); cursor: not-allowed; }
    #status { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--accent-text); padding: 12px 26px; border-radius: 30px; font-size: 13.5px; font-weight: 600; display: none; z-index: 9999; box-shadow: var(--shadow-lg); }
    .exit-xr { position: fixed; top: 24px; right: 24px; background: rgba(23,23,27,0.9); color: var(--text); border: 1px solid var(--border-soft); border-radius: 50%; width: 48px; height: 48px; display: none; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; z-index: 9999; font-weight: 300; box-shadow: var(--shadow-lg); }
    .xr-active .exit-xr { display: flex; }
    .xr-active #overlay { display: none; }
    video { display: none; }

    /* Access-code gate (spec ID:02_07) — same scrim/modal-box language as the Builder. */
    .solo-modal { display: none; position: fixed; inset: 0; background: rgba(4,4,6,0.6); align-items: center; justify-content: center; z-index: 10500; padding: 20px; box-sizing: border-box; }
    .solo-modal.show { display: flex; }
    .solo-modal-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 18px; padding: 22px; max-width: 360px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); }
    .solo-modal-card h3 { margin: 0 0 6px 0; font-size: 16px; font-weight: 700; }
    .solo-modal-card p { margin: 0 0 18px 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    #code-gate-input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 19px; letter-spacing: 4px; text-align: center; background: var(--field-bg); border: 1px solid var(--border-soft); color: var(--text); border-radius: 10px; margin-bottom: 12px; outline: none; }
    #code-gate-input:focus { border-color: var(--text); }
    #code-gate-error { color: var(--red); font-size: 12.5px; min-height: 18px; margin: -4px 0 8px 0; }
    .solo-modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .solo-modal-actions button { padding: 13px; border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: background .15s; }
    #code-gate-confirm { background: var(--accent); color: var(--accent-text); }
    #code-gate-confirm:hover { background: #fff; }
    #code-gate-cancel { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-soft); }
    #code-gate-cancel:hover { background: var(--field-bg); }
  </style>
</head>
<body>
  <!-- Audio is intentionally ON (training narration). playsinline keeps it inline on mobile. -->
  <video id="video" playsinline crossorigin="anonymous"></video>

  <div id="overlay">
    <div class="card">
      <div class="logo-container">
        <h1>E-Læring Player</h1>
      </div>
      <!-- Main menu (spec ID:02_03): scenarios living in a folder on the headset,
           e.g. Downloads/Scenarios — read straight off the device instead of
           one file at a time. Shown only where the browser supports it (Meta
           Quest Browser does); the manual picker below always remains as a
           fallback. -->
      <div id="scenario-folder-section" style="display:none;">
        <button type="button" id="open-folder-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z"/></svg> Open scenarios folder</button>
        <div id="scenario-menu"></div>
      </div>

      <div class="file-drop-area">
        <span>Click to Upload Scenario</span>
        <small>.zip file exported from the Builder</small>
        <input type="file" id="file-input" accept=".zip,.lxr">
      </div>
      <div id="session-info"></div>
      <button id="start-button" disabled>Enter Immersive VR</button>
      <button id="preview-button" disabled>Run on this screen (no headset)</button>
    </div>
  </div>

  <button class="exit-xr" id="exit-xr" aria-label="Exit VR">×</button>
  <div id="status"></div>

  <!-- Scenario access code (req. ID:02_07) — a scenario authored with a code
       set in the Builder can only be started once that code is entered here. -->
  <div class="solo-modal" id="code-gate-modal">
    <div class="solo-modal-card">
      <h3>Enter access code</h3>
      <p>This scenario is code-protected. Ask your instructor for the code to begin.</p>
      <input type="text" id="code-gate-input" placeholder="••••" autocomplete="off" inputmode="numeric" maxlength="4">
      <div id="code-gate-error"></div>
      <div class="solo-modal-actions">
        <button id="code-gate-confirm">Start</button>
        <button id="code-gate-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // THREE comes from vendor/three.min.js (classic script) — see the note in <head>.

    // Core 3D
    let camera, scene, renderer, xrSession = null, contentGroup;
    let videoElement, videoTexture, videoMaterial, videoMesh, fallbackEnvironment;
    let videoMeshL, videoMeshR; // stereo (sbs/tb) eye-exclusive meshes — layers 1/2, see applyVideoProjection
    let raycaster, reticle, clock;
    let xrSupported = false;
    let referenceSpaceType = 'local';
    let flatPreview = false;   // running on a normal screen, no headset

    // Logic state
    let gazeTimer = 0;
    let lastIntersectedChoice = null;
    const GAZE_TIME_THRESHOLD = 2.0;  // default dwell; overridable per scenario / per node
    let currentDwell = GAZE_TIME_THRESHOLD;
    // Gaze arming (§4.1): choices only become selectable a short moment AFTER they
    // appear, and a gaze already resting on a choice at that moment must leave and
    // re-enter before it can select — so the headset can never answer for the learner.
    const GAZE_ARM_DELAY = 0.7;
    let choicesVisible = false;   // were any choices selectable last frame?
    let armed = false;            // has the arming delay elapsed?
    let armTimer = 0;             // counts up to GAZE_ARM_DELAY once choices appear
    let preArmedChoice = null;    // choice the gaze was resting on when arming completed
    const MAX_DT = 0.1;           // clamp: no single frame may advance time by more (§2.1)
    let sessionData = null;
    let assetCache = {};
    let currentNode = null;
    let nodeTimer = 0;            // monotonic scenario clock for the current node
    let lastVideoTime = 0;        // last currentTime seen from the clip
    let videoStalledFor = 0;      // seconds the clip has failed to advance
    const VIDEO_STALL_GRACE = 0.75; // → wall-clock takes over after this
    let videoReady = false;       // has the current node's video produced a first frame? (§4.2)
    let videoFailed = false;      // did the current node's video error / time out? (§4.3)
    let videoLoadStart = 0;       // performance.now() when the current node's video load began
    const VIDEO_LOAD_TIMEOUT = 20;// seconds to wait for a video before declaring it failed
    let videoLoadTimer = null;    // independent wall-clock timer that fails a never-ready clip (§4.3)
    let activeChoices = [];

    // Where the "Play" gate (shown when autoplay is blocked) sits. An earlier
    // version of this fix PUSHED the gate further down (toward higher pctY)
    // to dodge a long question's answer stack -- but "down" is also the
    // direction of the exit affordance at pctY 96, and the Play button's own
    // box (512x200 @ scale 1.2 -> half-height ~0.469 world units at its
    // radius 6.0) is tall enough that even the old default of 88 already
    // overlapped exit's box (360x120 @ scale 0.7, half-height ~0.164 @
    // radius 5.5) before any question was involved -- confirmed by measuring
    // both meshes' actual Three.js world-space bounds in a live test, not by
    // hand-waved trig. Converting each half-height to the same arc-length
    // degree units the qGroup shrink math already uses (angle ≈ half-height /
    // radius, in radians):
    //   playHalfDeg ≈ (0.9375/2) / (6.0 * PI/180)  ≈ 4.48°
    //   exitHalfDeg ≈ (0.328125/2) / (5.5 * PI/180) ≈ 1.71°
    // so the two boxes only clear each other once their centres are more than
    // ~6.2° apart -- plus a buffer degree -- which on this 50°-arc-to-100-pctY
    // mapping is ~14.4 pctY units below exit's 96. That puts the ONLY
    // exit-safe resting spot at ~81.6 pctY, i.e. well above (numerically
    // below) the old 88 default. So instead of ever moving the gate closer to
    // exit, it now has one fixed, exit-safe rest position, and the thing that
    // gives way for a crowded question is the gate's own SIZE (playGateScale
    // below), the same "shrink to fit, never move the fixed landmark" pattern
    // the qGroup-vs-exit code already uses.
    const PLAY_GATE_PCT_Y = 81;
    // Play button's own half-height, expressed in pctY units at full scale
    // (derived the same way as PLAY_GATE_PCT_Y above: 4.48° / 50° * 100).
    const PLAY_GATE_HALF_PCT_Y = 8.95;
    let playGateScale = 1;
    let overlaysGroup = new THREE.Group();
    let sessionEnding = false;    // idempotency guard for endSession (§2.2)
    let endTimer = null;          // pending end-node → endSession timer (§2.2)
    let loadingPlane = null;      // in-headset "loading video" indicator (§4.2)
    let isTransitioning = false;  // guards a node transition in progress (was window.*)

    // Fade-to-black (spec ID:02_09/02_10/02_11): a camera-locked black plane, opacity
    // driven each frame in render(). SCENE_FADE_SEC is the short cut between scenes
    // (smooth transitions); END_FADE_SEC is the longer fade over the very end.
    const SCENE_FADE_SEC = 0.45;
    const END_FADE_SEC = 4;
    let fadeMesh = null;
    let fadeState = null; // {from, to, dur, t, onDone}

    // Audio narration overlay (spec ID:01_12): one optional clip per node.
    const narrationAudio = new Audio();
    let narrationPlayed = false;
    let currentProjection = '360';
    let currentStereo = 'mono';
    let videoWantsVisible = false; // tracks intent; syncStereoVisibility() resolves it to the right mesh(es)

    // Clamp an author-supplied dwell time to a sane range; returns 0 for anything
    // non-numeric so the caller's `|| default` chain falls through.
    function clampDwell(v) {
      const n = parseFloat(v);
      if (!isFinite(n) || n <= 0) return 0;
      return Math.max(0.5, Math.min(10, n));
    }

    // Reused temps (no per-frame allocation)
    const _gazeOrigin = new THREE.Vector3();
    const _gazeDir = new THREE.Vector3();
    const _gazeQuat = new THREE.Quaternion();

    let sessionStartTime = 0;


    // Every run is local-only: no relay, no heartbeats, no remote start/stop.
    // A scenario authored with an access code (§ code-gate-modal) still needs
    // that code typed in before it begins — see attemptStart() below.
    let previewEmbedMode = false;

    // Loads the first node of the scenario. Split out from beginScenario() so
    // the code-gate (below) can defer it until the correct code is entered.
    function proceedToFirstNode() {
      currentNode = sessionData.nodes.find(n => n.id === sessionData.startNode);
      if (currentNode) {
        loadNode(currentNode);
        // BUGFIX: selectChoice() schedules auto-termination whenever a choice or
        // auto-advance leads INTO an end node, but a scenario whose START node is
        // itself an end node (e.g. authored by mistake via "Set as Start", or a
        // scenario that is just a single end screen) skipped that call entirely --
        // beginScenario() only ever called loadNode() here. End nodes also never
        // get the in-VR exit affordance (it's intentionally suppressed so a normal
        // end screen doesn't show a redundant exit prompt), so the two omissions
        // combined left the learner on a screen with no automatic completion and
        // no way to advance from inside the headset. Mirror selectChoice's own
        // end-node handling here so a start-node-is-end scenario finishes cleanly.
        if (currentNode.type === 'end') {
          const secs = parseFloat(currentNode.duration);
          scheduleEndSession((secs > 0 ? secs : 3) * 1000);
        }
      } else {
        // `session` was not in scope here, so a package with a dangling startNode
        // threw ReferenceError instead of ending cleanly, leaving a black headset.
        updateStatus('Error: Start node not found.', true);
        endSession();
      }
    }
    const startButton = document.getElementById('start-button');
    const fileInput = document.getElementById('file-input');
    const sessionInfo = document.getElementById('session-info');
    const statusElement = document.getElementById('status');
    const exitButton = document.getElementById('exit-xr');
    const previewButton = document.getElementById('preview-button');
    // Start/Preview just need a loaded scenario — there's no fleet of headsets to
    // attribute a run to and no dashboard to feed, so unlike the platform this was
    // forked from, entering a name/group here isn't a precondition to start.
    function updateStartEnabled() {
      const loaded = !!sessionData;
      startButton.disabled = !(loaded && xrSupported);
      previewButton.disabled = !loaded;
      if (loaded) {
        sessionInfo.textContent = `Ready: ${sessionData.title}`;
        sessionInfo.classList.add('show');
      }
    }

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      scene.add(camera);

      // Everything the learner looks AT (video, overlays, waypoints, the fallback
      // wireframe) lives under this group, kept separate from the camera. Auto-
      // reorientation on scene arrival (spec ID:02_08C) rotates this group around Y
      // so the authored "start position" lands wherever the learner is already
      // facing physically — the camera's own transform stays exactly as tracked, so
      // gaze raycasting (which reads camera world direction) needs no changes at all.
      contentGroup = new THREE.Group();
      scene.add(contentGroup);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();
      raycaster = new THREE.Raycaster();

      const envGeo = new THREE.SphereGeometry(20, 32, 32);
      const envMat = new THREE.MeshBasicMaterial({ color: 0x1f2937, wireframe: true, transparent: true, opacity: 0.1 });
      fallbackEnvironment = new THREE.Mesh(envGeo, envMat);
      contentGroup.add(fallbackEnvironment);

      videoElement = document.getElementById('video');
      videoTexture = new THREE.VideoTexture(videoElement);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;
      videoTexture.colorSpace = THREE.SRGBColorSpace; // fix: 360 footage no longer washed out

      videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.FrontSide });
      videoMesh = new THREE.Mesh(makeProjectionGeometry('360'), videoMaterial);
      videoMesh.visible = false;
      contentGroup.add(videoMesh);

      // Stereo (SBS/top-bottom) rendering: two extra meshes sharing the same video
      // texture, each cropped to one eye's half via UV and placed on a WebXR-only
      // render layer. Three.js's WebXRManager gives each eye's camera layer 0 (default,
      // shared) PLUS layer 1 (left eye) or layer 2 (right eye) — so a mesh on layer 1
      // ONLY renders for the left eye, layer 2 ONLY for the right, and layer-0 objects
      // (all overlays/text/images) render identically to both, which is exactly what
      // keeps overlays from ever splitting or doubling. The flat desktop camera has no
      // extra layers enabled, so these two meshes are naturally invisible outside XR —
      // applyVideoProjection() falls back to showing the plain mono mesh there instead.
      videoMeshL = new THREE.Mesh(makeProjectionGeometry('360'), videoMaterial);
      videoMeshL.visible = false;
      videoMeshL.layers.set(1);
      contentGroup.add(videoMeshL);

      videoMeshR = new THREE.Mesh(makeProjectionGeometry('360'), videoMaterial);
      videoMeshR.visible = false;
      videoMeshR.layers.set(2);
      contentGroup.add(videoMeshR);

      // Camera-locked black fade plane (spec ID:02_09/10/11) — always in front, opacity 0 until used.
      const fadeGeo = new THREE.PlaneGeometry(4, 4);
      const fadeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthTest: false });
      fadeMesh = new THREE.Mesh(fadeGeo, fadeMat);
      fadeMesh.position.set(0, 0, -1.2);
      fadeMesh.renderOrder = 999;
      fadeMesh.visible = false;
      camera.add(fadeMesh);

      contentGroup.add(overlaysGroup);
      setupGazeInteraction();

      // WebXR capability gate
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-vr').then(s => {
          xrSupported = s;
          if (!s) updateStatus('Immersive VR not supported on this device/browser', true);
          updateStartEnabled();
        }).catch(() => { xrSupported = false; });
      } else {
        xrSupported = false;
        updateStatus('WebXR not available in this browser', true);
      }

      // Video-readiness signals (§4.2/§4.3): the node timeline is held at 0 until a
      // real first frame exists, so timed overlays never fire over a black sphere.
      videoElement.addEventListener('loadeddata', () => { videoReady = true; clearVideoLoadTimer(); });
      videoElement.addEventListener('playing',    () => { videoReady = true; clearVideoLoadTimer(); });
      videoElement.addEventListener('error',      markVideoFailed);

      buildLoadingPlane();

      window.addEventListener('resize', onWindowResize);
      startButton.addEventListener('click', function () { attemptStart(startXR); });
      previewButton.addEventListener('click', function () { attemptStart(startFlatPreview); });
      exitButton.addEventListener('click', endSession);
      fileInput.addEventListener('change', handleFileSelect);

      initScenarioFolderMenu();
    }

    // A small camera-locked plane shown while a node's video is still buffering,
    // so the learner sees "loading" rather than a silent black sphere (§4.2).
    function buildLoadingPlane() {
      loadingPlane = createTextPlane('Indlæser video…', {
        width: 512, height: 128, fontSize: 40, backgroundColor: 'rgba(17,24,39,0.85)',
        textColor: 'white', fontWeight: '600'
      });
      loadingPlane.position.set(0, 0, -2.5);
      loadingPlane.visible = false;
      camera.add(loadingPlane);
    }

    function showLoading(show) {
      if (loadingPlane) loadingPlane.visible = show;
    }

    function setupGazeInteraction() {
      const reticleGeo = new THREE.RingGeometry(0.015, 0.02, 32);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.7, transparent: true, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(reticleGeo, reticleMat);

      const gazeProgressGeo = new THREE.CircleGeometry(0.015, 32);
      const gazeProgressMat = new THREE.MeshBasicMaterial({ color: 0x0969da, opacity: 0.9, transparent: true, side: THREE.DoubleSide });
      const gazeProgress = new THREE.Mesh(gazeProgressGeo, gazeProgressMat);
      gazeProgress.name = 'gazeProgress';
      gazeProgress.scale.set(0, 0, 0);

      reticle.add(gazeProgress);
      reticle.position.z = -1;
      camera.add(reticle);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // === Upload validation (§6.3) ===
    const MAX_ZIP_ENTRIES = 500;
    const MAX_UNCOMPRESSED = 3 * 1024 * 1024 * 1024; // 3 GB total across all entries

    // Normalise a zip-internal path and confirm it stays within `prefix`. Rejects
    // absolute paths and any "../" escape. Returns the normalised path or null.
    function withinFolder(path, prefix) {
      if (typeof path !== 'string' || !path) return null;
      const norm = path.replace(/\\/g, '/');
      if (norm.charAt(0) === '/' || norm.indexOf('..') !== -1) return null;
      return norm.indexOf(prefix) === 0 ? norm : null;
    }

    function validateScenarioZip(zip) {
      const names = Object.keys(zip.files);
      if (names.length > MAX_ZIP_ENTRIES) {
        throw new Error('Scenario has too many files (' + names.length + ').');
      }
      let total = 0;
      names.forEach(name => {
        const entry = zip.files[name];
        // _data.uncompressedSize is populated by JSZip while reading the central
        // directory — a zip-bomb guard that does not require decompressing anything.
        const size = (entry && entry._data && entry._data.uncompressedSize) || 0;
        total += size;
        // Every non-manifest entry must live under videos/ or images/ and not escape.
        if (name === 'project.json' || /\/$/.test(name)) return;
        if (!withinFolder(name, 'videos/') && !withinFolder(name, 'images/') && !withinFolder(name, 'audio/')) {
          throw new Error('Scenario contains an unexpected file: ' + name);
        }
      });
      if (total > MAX_UNCOMPRESSED) {
        throw new Error('Scenario is too large when unpacked.');
      }
    }

    function validateProject(data) {
      if (!data || typeof data !== 'object') throw new Error('project.json is not an object.');
      if (!Array.isArray(data.nodes) || !data.nodes.length) throw new Error('project.json has no nodes.');
      if (!data.startNode) throw new Error('project.json has no start node.');
    }

    // Only resolve an asset the manifest points at IF its declared file path is safe.
    function safeAssetFile(zip, filePath, prefix) {
      const safe = withinFolder(filePath, prefix);
      return safe ? zip.file(safe) : null;
    }

    // === Data & File Loading ===
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      loadScenarioFromFile(file);
    }

    async function loadScenarioFromFile(file) {
      sessionInfo.textContent = 'Loading scenario packages...';
      sessionInfo.classList.add('show');
      startButton.disabled = true;
      previewButton.disabled = true;
      sessionData = null;

      Object.keys(assetCache).forEach(url => URL.revokeObjectURL(assetCache[url]));
      assetCache = {};

      try {
        const zip = await JSZip.loadAsync(file);
        const projectFile = zip.file('project.json');

        // SECURITY (§6.2): the legacy `index.html` + `const flow = {…}` package was
        // scraped and run through new Function(), i.e. arbitrary code execution from
        // an uploaded file. That path is deleted. project.json is the only format.
        if (!projectFile) {
          throw new Error('Not an E-Læring scenario — no project.json inside the .zip.');
        }

        // Structural validation before anything touches the DOM / decoder (§6.3):
        // cap entry count + uncompressed size, and reject any asset path that
        // escapes the videos/ or images/ folders (path-traversal guard).
        validateScenarioZip(zip);

        const projectData = await projectFile.async('string');
        sessionData = JSON.parse(projectData);
        validateProject(sessionData);

        const assetPromises = [];
        if (sessionData.assets && sessionData.assets.videos) {
          sessionData.assets.videos.forEach(v => {
            const f = safeAssetFile(zip, v.file, 'videos/');
            if (f) assetPromises.push(f.async('blob').then(b => { const _ext = (v.file || '').toLowerCase(); const _mime = _ext.endsWith('.webm') ? 'video/webm' : 'video/mp4'; const _typed = (b.type === _mime) ? b : new Blob([b], { type: _mime }); assetCache[v.id] = URL.createObjectURL(_typed); }));
          });
        }
        if (sessionData.assets && sessionData.assets.images) {
          sessionData.assets.images.forEach(img => {
            const f = safeAssetFile(zip, img.file, 'images/');
            if (f) assetPromises.push(f.async('blob').then(b => { const _ext = (img.file || '').toLowerCase(); const _mime = _ext.endsWith('.png') ? 'image/png' : _ext.endsWith('.webp') ? 'image/webp' : _ext.endsWith('.gif') ? 'image/gif' : (_ext.endsWith('.jpg') || _ext.endsWith('.jpeg')) ? 'image/jpeg' : b.type; const _typed = (!_mime || b.type === _mime) ? b : new Blob([b], { type: _mime }); assetCache[img.id] = URL.createObjectURL(_typed); }));
          });
        }
        if (sessionData.assets && sessionData.assets.audio) {
          sessionData.assets.audio.forEach(au => {
            const f = safeAssetFile(zip, au.file, 'audio/');
            if (f) assetPromises.push(f.async('blob').then(b => { const _ext = (au.file || '').toLowerCase(); const _mime = _ext.endsWith('.wav') ? 'audio/wav' : _ext.endsWith('.ogg') ? 'audio/ogg' : 'audio/mpeg'; const _typed = (b.type === _mime) ? b : new Blob([b], { type: _mime }); assetCache[au.id] = URL.createObjectURL(_typed); }));
          });
        }
        await Promise.all(assetPromises);

        if (!sessionData || !sessionData.nodes || !sessionData.startNode) {
          throw new Error('Invalid project structure.');
        }

        sessionInfo.textContent = `Ready: ${sessionData.title}`;
        updateStartEnabled();
        updateStatus(xrSupported ? 'Scenario loaded successfully!' : 'Loaded — run it on this screen, or open this page on a WebXR headset', !xrSupported);
      } catch (err) {
        console.error('Failed to load:', err);
        sessionInfo.textContent = 'Error parsing file.';
        updateStatus(`Error: ${err.message}`, true);
      }
    }

    // === Headset scenario menu (spec ID:02_03) ===
    // Reads scenario .zip/.lxr files straight out of a folder on the headset —
    // e.g. Downloads/Scenarios — instead of a one-file-at-a-time picker. Uses
    // the File System Access API (supported in the Meta Quest Browser); the
    // manual .zip picker above always remains as a fallback where it isn't.
    const SCENARIO_EXT = /\.(zip|lxr)$/i;
    let scenarioDirHandle = null;
    function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('lxr_player', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbGet(key) {
      try {
        const db = await idbOpen();
        return await new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readonly').objectStore('kv').get(key);
          tx.onsuccess = () => res(tx.result); tx.onerror = () => rej(tx.error);
        });
      } catch (e) { return null; }
    }
    async function idbSet(key, val) {
      try {
        const db = await idbOpen();
        await new Promise((res, rej) => {
          const tx = db.transaction('kv', 'readwrite').objectStore('kv').put(val, key);
          tx.onsuccess = () => res(); tx.onerror = () => rej(tx.error);
        });
      } catch (e) {}
    }

    async function scanScenarioFolder(dirHandle) {
      const menu = document.getElementById('scenario-menu');
      menu.innerHTML = '<div style="font-size:12px;color:var(--muted);">Scanning…</div>';
      const items = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && SCENARIO_EXT.test(name)) items.push({ name, handle });
      }
      if (!items.length) {
        menu.innerHTML = '<div style="font-size:12px;color:var(--muted);">No scenarios found in this folder.</div>';
        return;
      }
      menu.innerHTML = '';
      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'scenario-menu-item';
        btn.textContent = item.name;
        btn.addEventListener('click', async () => {
          const file = await item.handle.getFile();
          loadScenarioFromFile(file);
        });
        menu.appendChild(btn);
        // Best-effort title peek: swaps the raw filename for the real scenario
        // title as soon as it's known, without blocking the menu meanwhile.
        item.handle.getFile()
          .then(f => JSZip.loadAsync(f))
          .then(zip => { const pj = zip.file('project.json'); return pj ? pj.async('string') : null; })
          .then(str => {
            if (!str) return;
            const title = JSON.parse(str).title;
            if (title) btn.innerHTML = escHtml(title) + '<small>' + escHtml(item.name) + '</small>';
          }).catch(() => {});
      });
    }

    async function openScenarioFolder() {
      try {
        const handle = await window.showDirectoryPicker();
        scenarioDirHandle = handle;
        await idbSet('scenarioDir', handle);
        scanScenarioFolder(handle);
      } catch (e) { /* user cancelled the picker */ }
    }

    async function initScenarioFolderMenu() {
      if (!('showDirectoryPicker' in window)) return; // fallback stays the single-file picker
      const section = document.getElementById('scenario-folder-section');
      const openBtn = document.getElementById('open-folder-btn');
      section.style.display = 'block';

      openBtn.addEventListener('click', async () => {
        if (scenarioDirHandle) {
          try {
            const perm = await scenarioDirHandle.requestPermission({ mode: 'read' });
            if (perm === 'granted') { scanScenarioFolder(scenarioDirHandle); return; }
          } catch (e) {}
        }
        openScenarioFolder();
      });

      const saved = await idbGet('scenarioDir');
      if (saved) {
        scenarioDirHandle = saved;
        try {
          const perm = await saved.queryPermission({ mode: 'read' });
          if (perm === 'granted') { scanScenarioFolder(saved); return; }
        } catch (e) {}
        openBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z"/></svg> Continue with saved scenarios folder';
      }
    }

    // === Embedded-in-Builder preview ===
    // The Builder used to reimplement its own flat HTML/CSS renderer for its
    // preview panel — a second copy of the layout math that inevitably drifted
    // from what the headset actually shows (clipped text boxes, tiny answer
    // buttons, choices landing on the exit button never showed up here even
    // though they did on a real Quest). Instead the Builder now embeds THIS
    // page in an iframe and drives it over postMessage, so "preview" is this
    // exact renderer running in flatPreview mode — not a lookalike.
    window.addEventListener('message', function (e) {
      const msg = e.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'lxrPreviewLoad') {
        previewEmbedMode = true;

        // NOT revoked here, unlike a real .zip load's assetCache reset: these
        // blob: URLs belong to the Builder (it minted them at upload time and
        // owns their lifecycle), not this page. Per the File API spec a
        // blob: URL is usable by any document sharing its origin, not only
        // the one that created it, so aliasing the string directly is both
        // simpler and more reliable than transferring the underlying Blob and
        // re-minting a URL here — that route looked right (the bytes came
        // through intact) but a <video> given a blob: URL made from a
        // cross-realm-transferred Blob would never leave readyState 0 in
        // testing, a real Chromium media-pipeline quirk, not a mistake in the
        // transfer.
        assetCache = {};
        (msg.assets || []).forEach(a => { if (a && a.id && a.url) assetCache[a.id] = a.url; });

        sessionData = msg.scenario;
        if (!sessionData || !sessionData.nodes) return;

        if (xrSession) { try { xrSession.end(); } catch (_) {} }
        if (flatPreview) { flatPreview = false; renderer.setAnimationLoop(null); }
        startFlatPreview();
        return;
      }

      if (msg.type === 'lxrPreviewUpdateNode') {
        // Author is editing the node currently on screen — refresh it in
        // place with the real production code path (same as a real choice
        // taking you back to a node), so text/answer/position edits show up
        // live without tearing down the whole preview session.
        if (!previewEmbedMode || !sessionData || !msg.node) return;
        const idx = sessionData.nodes.findIndex(n => n.id === msg.node.id);
        if (idx !== -1) sessionData.nodes[idx] = msg.node;
        // currentNode is a separate reference from the sessionData.nodes entry
        // above — every real navigation path (selectChoice, proceedToFirstNode)
        // reassigns it explicitly before calling loadNode(), and loadNode()
        // itself never does. Skipping this left currentNode pointing at the
        // stale pre-edit object even though the array and the screen updated.
        if (currentNode && currentNode.id === msg.node.id) { currentNode = msg.node; loadNode(msg.node); }
        return;
      }

      if (msg.type === 'lxrPreviewGoto') {
        // Author clicked Restart / Back / Continue / jump-to-node in the
        // Builder's own nav, or opened the preview on a specific node.
        if (!previewEmbedMode || !sessionData) return;
        const node = sessionData.nodes.find(n => n.id === msg.nodeId);
        if (!node) return;
        currentNode = node;
        loadNode(node);
        if (node.type === 'end') {
          const secs = parseFloat(node.duration);
          scheduleEndSession((secs > 0 ? secs : 3) * 1000);
        }
      }
    }, false);

    // Access-code gate (req. ID:02_07): a scenario can only be started once
    // the code set on it in the Builder (sessionData.accessCode) is entered
    // here. A scenario authored with no code set skips the gate entirely.
    const codeGateModal = document.getElementById('code-gate-modal');
    const codeGateInput = document.getElementById('code-gate-input');
    const codeGateError = document.getElementById('code-gate-error');
    function attemptStart(launchFn) {
      if (previewEmbedMode) { launchFn(); return; } // author preview in the Builder never needs this
      const requiredCode = sessionData && sessionData.accessCode;
      if (!requiredCode) { launchFn(); return; }
      codeGateInput.value = ''; codeGateError.textContent = '';
      codeGateModal.classList.add('show');
      codeGateInput.focus();
      document.getElementById('code-gate-confirm').onclick = function () {
        if (codeGateInput.value.trim() === String(requiredCode).trim()) {
          codeGateModal.classList.remove('show');
          launchFn();
        } else {
          codeGateError.textContent = 'Wrong code — try again.';
        }
      };
      document.getElementById('code-gate-cancel').onclick = function () {
        codeGateModal.classList.remove('show');
      };
    }

    // === Immersive XR Lifecycle ===
    function startXR() {
      if (!sessionData) return;
      if (!xrSupported || !navigator.xr) { updateStatus('WebXR immersive-vr unavailable on this device', true); return; }
      // 'local-floor' is requested as an optional feature, so the reference space
      // actually granted may be either. Asking the renderer for 'local' regardless
      // (as the old code did) discards the floor-relative space when it IS granted.
      navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
        .then(session => {
          const spaces = (session.enabledFeatures || []);
          referenceSpaceType = spaces.indexOf('local-floor') !== -1 ? 'local-floor' : 'local';
          onSessionStarted(session);
        })
        .catch(err => updateStatus(`Failed to start VR: ${err.message}`, true));
    }

    // Runs the scenario in a plain browser window, with no headset: same node logic,
    // same timeline, same gaze dwell — the cursor stands in for the head direction.
    // Without this the module could not be demonstrated, checked, or used at all
    // unless a headset was physically present, which made every scenario impossible
    // to verify before handing it to a class.
    function startFlatPreview() {
      if (!sessionData || flatPreview || xrSession) return;
      flatPreview = true;
      document.body.classList.add('xr-active');
      camera.position.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);
      renderer.domElement.addEventListener('pointermove', onFlatPointerMove);
      renderer.setAnimationLoop(render);
      updateStatus('Preview mode — move the mouse to look, hold the cursor on an answer to choose');
      beginScenario();
    }

    // Mouse position maps to yaw/pitch across the same ±45° / ±25° arc the author
    // sees in the builder's safe-zone guide, so what is reachable here is what is
    // reachable in the headset.
    function onFlatPointerMove(e) {
      if (!flatPreview) return;
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = -nx * (Math.PI / 180 * 55);
      camera.rotation.x = -ny * (Math.PI / 180 * 35);
    }

    function onSessionStarted(session) {
      xrSession = session;
      document.body.classList.add('xr-active');
      renderer.xr.setReferenceSpaceType(referenceSpaceType);
      renderer.xr.setSession(session);
      renderer.setAnimationLoop(render);
      session.addEventListener('end', onSessionEnd);
      beginScenario();
    }

    // Everything that is identical between a headset run and a flat preview.
    function beginScenario() {
      // §2.1 — restart the delta clock at the top of EVERY run. THREE.Clock is created
      // once and keeps running while renderer.setAnimationLoop(null) has stopped frames;
      // without this reset the first frame of a second run returns the entire idle gap
      // as one dt and the whole timeline jumps forward. render() also clamps dt to
      // MAX_DT so a mid-run interruption (headset removed, system menu) cannot do this.
      clock.start();
      sessionEnding = false;
      if (endTimer) { clearTimeout(endTimer); endTimer = null; }
      showLoading(false);
      sessionStartTime = performance.now();

      proceedToFirstNode();
    }

    function onSessionEnd() {
      document.body.classList.remove('xr-active');
      renderer.setAnimationLoop(null);
      xrSession = null;
      flatPreview = false;
      if (endTimer) { clearTimeout(endTimer); endTimer = null; }
      clearVideoLoadTimer();
      showLoading(false);
      renderer.domElement.removeEventListener('pointermove', onFlatPointerMove);
      videoElement.pause();
      videoElement.removeAttribute('src');
      videoElement.load();
      narrationAudio.pause();
      narrationAudio.removeAttribute('src');
      fadeState = null;
      if (fadeMesh) { fadeMesh.material.opacity = 0; fadeMesh.visible = false; }
      clearOverlays();

      if (previewEmbedMode) {
        // A test click-through in the Builder is not a class run — just tell the
        // Builder it reached an end so its own preview UI (e.g. a Restart control) can react.
        try { parent.postMessage({ type: 'lxrPreviewEnded' }, '*'); } catch (_) {}
      }
      sessionStartTime = 0; currentNode = null;
    }

    // 180° footage (spec ID:01_07/02_?): a forward-facing half-dome instead of a full
    // sphere, so a 180° equirectangular clip isn't stretched around the whole circle.
    function makeProjectionGeometry(proj, stereo, eye) {
      // phiStart=PI centers the half-dome on the camera's default forward
      // direction (-Z) — verified empirically via raycasts from the origin,
      // since three.js's phi parameterization isn't the intuitive "0 = forward".
      const geo = proj === '180'
        ? new THREE.SphereGeometry(15, 64, 32, Math.PI, Math.PI, 0, Math.PI)
        : new THREE.SphereGeometry(15, 64, 32, 0, Math.PI * 2, 0, Math.PI);
      geo.scale(-1, 1, 1);
      if (stereo === 'sbs' || stereo === 'tb') applyStereoUV(geo, stereo, eye || 'left');
      return geo;
    }

    // Crops a projection sphere's UVs to one eye's half of a packed stereo frame.
    // sbs (side-by-side): left eye = left half of the frame (u 0..0.5), right eye =
    // right half (u 0.5..1) — u isn't affected by texture flipY, so this is the plain,
    // unambiguous "left eye is physically on the left" convention.
    // tb (top-bottom / over-under): convention is frame TOP half = left eye. This
    // renderer's v=0 renders at the sphere's "up" and samples the SOURCE IMAGE'S
    // BOTTOM row (texture.flipY defaults to true) — verified empirically by rendering
    // a red-top/blue-bottom test texture and reading back the pixel the camera saw
    // looking straight up (came back blue, i.e. v=0 = image-bottom). So the image's
    // top half (left eye) is v 0.5..1, and the bottom half (right eye) is v 0..0.5.
    function applyStereoUV(geo, mode, eye) {
      const uv = geo.attributes.uv;
      if (mode === 'sbs') {
        const offset = eye === 'right' ? 0.5 : 0;
        for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * 0.5 + offset);
      } else {
        const offset = eye === 'left' ? 0.5 : 0;
        for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * 0.5 + offset);
      }
      uv.needsUpdate = true;
    }

    function applyVideoProjection(proj, stereo) {
      proj = proj === '180' ? '180' : '360';
      stereo = (stereo === 'sbs' || stereo === 'tb') ? stereo : 'mono';
      if (proj === currentProjection && stereo === currentStereo) return;
      currentProjection = proj;
      currentStereo = stereo;

      videoMesh.geometry.dispose();
      videoMesh.geometry = makeProjectionGeometry(proj);

      videoMeshL.geometry.dispose();
      videoMeshR.geometry.dispose();
      if (stereo === 'mono') {
        // Reuse the plain full-frame geometry so there's nothing to build per eye.
        videoMeshL.geometry = makeProjectionGeometry(proj);
        videoMeshR.geometry = makeProjectionGeometry(proj);
      } else {
        videoMeshL.geometry = makeProjectionGeometry(proj, stereo, 'left');
        videoMeshR.geometry = makeProjectionGeometry(proj, stereo, 'right');
      }
      syncStereoVisibility();
    }

    // Reconciles which mesh(es) are actually visible against (a) whether a video is
    // currently meant to be showing at all and (b) whether we're in an active XR
    // stereo session. Flat/desktop preview always uses the mono mesh (layer 0) —
    // videoMeshL/R live on XR-only layers so a flat camera never sees them, but we
    // still keep the mono mesh authoritative there rather than relying on that by
    // accident. Call this whenever visibility, stereo mode, or the XR session state
    // might have changed — it's cheap and idempotent.
    function syncStereoVisibility() {
      const wantVideo = videoWantsVisible;
      const stereoActive = currentStereo !== 'mono' && renderer.xr.isPresenting;
      videoMesh.visible = wantVideo && !stereoActive;
      videoMeshL.visible = videoMeshR.visible = wantVideo && stereoActive;
    }

    // Auto-reorientation on scene arrival (spec ID:02_08C): "the start position
    // adjusts automatically so it's always correctly facing the learner's
    // perspective." We can't move the learner's real head, so instead we rotate
    // the CONTENT around them — whatever direction they happen to be physically
    // facing when a node loads becomes "forward" relative to that node's authored
    // start-yaw (Builder's compass dial, 0-359°, same 0°=forward/clockwise-right
    // convention as the overlay-position yaw used elsewhere in this file).
    //
    // Derivation: a point authored at content-yaw Y sits, before any contentGroup
    // rotation, at direction (sin Y, 0, -cos Y). Rotating contentGroup by R moves
    // it to (sin(Y-R), 0, -cos(Y-R)) — i.e. effective yaw becomes Y-R. The camera's
    // own forward direction at camera.rotation.y = θ is (-sin θ, 0, -cos θ), which
    // in the same (sin a, 0, -cos a) parametrization is a = -θ. Setting Y-R = -θ
    // gives R = Y + θ: rotate content by the authored yaw PLUS the camera's
    // current yaw, so the authored direction lands exactly on the camera's
    // current forward regardless of which way the learner happens to be facing.
    const _reorientEuler = new THREE.Euler();
    function orientContentToStart(node) {
      const startYawRad = THREE.MathUtils.degToRad((node && node.startYaw) || 0);
      _reorientEuler.setFromQuaternion(camera.quaternion, 'YXZ');
      contentGroup.rotation.y = startYawRad + _reorientEuler.y;
    }

    // Fade-to-black driver, ticked from render(). onDone fires once, at completion.
    function fadeTo(target, dur, onDone) {
      fadeMesh.visible = true;
      fadeState = { from: fadeMesh.material.opacity, to: target, dur: Math.max(0.05, dur), t: 0, onDone: onDone };
    }
    function tickFade(dt) {
      if (!fadeState) return;
      fadeState.t += dt;
      const p = Math.min(1, fadeState.t / fadeState.dur);
      fadeMesh.material.opacity = fadeState.from + (fadeState.to - fadeState.from) * p;
      if (p >= 1) {
        const done = fadeState.onDone;
        fadeMesh.visible = fadeState.to > 0.001;
        fadeState = null;
        if (done) done();
      }
    }

    // === Video playback with a real fallback (no silent swallow) ===
    function playVideo(src) {
      videoElement.src = src;
      videoElement.loop = false;
      videoWantsVisible = true;
      syncStereoVisibility();
      const p = videoElement.play();
      if (p && p.catch) p.catch(() => showPlayGate());
    }

    function showPlayGate() {
      if (overlaysGroup.getObjectByName('playGate')) return;
      updateStatus('Gaze the ▶ Play button to start the video', true);
      const btn = createTextPlane('▶ Play', { width: 512, height: 200, fontSize: 72, backgroundColor: 'rgba(9,105,218,0.95)', textColor: 'white', fontWeight: '700', scale: 1.2 });
      // Low in the field of view, and nearer than the question arc. It used to sit
      // dead centre at the same depth as the question, so whenever autoplay was
      // blocked the gate covered the answers and swallowed every gaze aimed at them —
      // the learner could see the choices but could never select one. The position
      // itself is a fixed, exit-safe spot (PLAY_GATE_PCT_Y); playGateScale (computed
      // in loadNode, per node) shrinks the button instead when a long question with
      // many answers reaches down far enough to otherwise crowd it.
      positionMeshFromXY(btn, 50, PLAY_GATE_PCT_Y, 6.0);
      btn.scale.setScalar(playGateScale);
      btn.name = 'playGate';
      btn.userData = { isChoice: true, choiceData: { __retryPlay: true, label: 'play_gate' } };
      overlaysGroup.add(btn);
      activeChoices.push(btn);
    }

    function clearPlayGate() {
      const gate = overlaysGroup.getObjectByName('playGate');
      if (gate) { overlaysGroup.remove(gate); disposeNode(gate); activeChoices = activeChoices.filter(c => c !== gate); }
    }

    function clearVideoLoadTimer() {
      if (videoLoadTimer) { clearTimeout(videoLoadTimer); videoLoadTimer = null; }
    }

    // Declare the current node's video unloadable and let the run continue (§4.3).
    // Shared by the 'error' listener, the render-loop timeout and the independent
    // wall-clock timer below so all three routes behave identically and idempotently.
    function markVideoFailed() {
      clearVideoLoadTimer();
      if (videoFailed || videoReady) return;
      videoFailed = true;
      showLoading(false);
      updateStatus('Video kunne ikke indlæses — fortsætter', true);
    }

    // === Node Logic ===
    async function loadNode(node) {
      if (previewEmbedMode) { try { parent.postMessage({ type: 'lxrPreviewNode', nodeId: node.id }, '*'); } catch (_) {} }
      orientContentToStart(node);
      clearOverlays();
      nodeTimer = 0;
      lastVideoTime = 0;
      videoStalledFor = 0;
      videoReady = false;
      videoFailed = false;
      videoLoadStart = performance.now();
      clearVideoLoadTimer();       // drop any pending timer from the previous node
      isTransitioning = false;
      // Reset gaze arming for the new node (§4.1).
      choicesVisible = false; armed = false; armTimer = 0; preArmedChoice = null;
      // Dwell time: per-node override → per-scenario override → 2.0s default (§4.1).
      currentDwell = clampDwell(node.gazeDwellSec) || clampDwell(sessionData.gazeDwellSec) || GAZE_TIME_THRESHOLD;

      videoElement.pause();
      videoWantsVisible = false;
      syncStereoVisibility();
      narrationAudio.pause();
      narrationPlayed = false;
      showLoading(!!node.video);   // show the buffering indicator only for video nodes
      if (node.video) {
        let videoSrc = assetCache[node.video];
        let videoAsset = null;
        if (sessionData.assets && sessionData.assets.videos) {
          videoAsset = sessionData.assets.videos.find(v => v.id === node.video);
          if (!videoSrc && videoAsset) videoSrc = assetCache[videoAsset.id] || assetCache[videoAsset.name];
        }
        applyVideoProjection(videoAsset && videoAsset.projection, videoAsset && videoAsset.stereo);
        if (node.narration && node.narration.file && assetCache[node.narration.file]) {
          narrationAudio.src = assetCache[node.narration.file];
        } else {
          narrationAudio.removeAttribute('src');
        }
        if (videoSrc) {
          playVideo(videoSrc);
          // Hard wall-clock timeout, independent of any video event AND of the rAF
          // render loop. Some malformed clips (e.g. a truncated file) never fire
          // 'error' and never leave NETWORK_LOADING, so the 'error' listener never
          // runs; and the render-loop timeout only ticks while frames are produced,
          // so a backgrounded tab or a stalled XR frame loop could hold the spinner
          // forever. A plain timer fires regardless of both, guaranteeing the run
          // always moves on. markVideoFailed() no-ops if the clip became ready first.
          clearVideoLoadTimer();
          videoLoadTimer = setTimeout(markVideoFailed, VIDEO_LOAD_TIMEOUT * 1000);
        }
        else { videoFailed = true; showLoading(false); }  // referenced clip absent
      }

      if (node.imageOverlays) {
        for (const io of node.imageOverlays) {
          if (!io.imageId || !assetCache[io.imageId]) continue;
          const mesh = await createImagePlane(assetCache[io.imageId], { scale: io.scale || 1 });
          if (mesh) {
            positionMeshFromXY(mesh, io.x, io.y, 7.5);
            mesh.userData = { startTime: io.time || 0, endTime: (io.time || 0) + (io.duration || 5), isOverlay: true };
            mesh.visible = false;
            overlaysGroup.add(mesh);
          }
        }
      }

      if (node.textOverlays) {
        for (const to of node.textOverlays) {
          // Optional formatting fields (§5.1) — all default to the previous look.
          // Spec ID:01_14A: an information-text overlay needs a frame and must be
          // semi-transparent. bgAlpha (author-set, 10-100) composes with the plain
          // hex background color into a real rgba — the color picker itself has no
          // alpha channel, so this is the only place transparency can come from.
          // `border` draws the same hue at full opacity as a solid rim around the
          // translucent fill, which is the frame the spec calls for.
          const textMesh = createTextPlane(to.text || '', {
            backgroundColor: hexToRgba(to.color || '#ffffff', to.bgAlpha != null ? to.bgAlpha : 90),
            border: to.color || '#ffffff',
            textColor: to.textColor || 'black',
            scale: to.scale || 1,
            fontSize: to.fontSize ? parseFloat(to.fontSize) : 32,
            fontWeight: to.fontWeight || 'normal',
            align: to.align || 'center'
          });
          positionMeshFromXY(textMesh, to.x, to.y, 7);
          textMesh.userData = { startTime: to.time || 0, endTime: (to.time || 0) + (to.duration || 3), isOverlay: true };
          textMesh.visible = false;
          overlaysGroup.add(textMesh);
        }
      }

      // Mid-video waypoints (spec ID:01_13): optional gaze hotspots that jump to
      // another node. __waypoint marks them so they never block auto-advance the
      // way an unanswered question would (see `choicesPending` in render()).
      if (node.waypoints) {
        for (const wp of node.waypoints) {
          if (!wp.target) continue;
          const wpMesh = createWaypointMarker(wp.label);
          positionMeshFromXY(wpMesh, wp.x !== undefined ? wp.x : 50, wp.y !== undefined ? wp.y : 50, 6.5);
          wpMesh.userData = {
            isOverlay: true, isChoice: true,
            startTime: wp.time || 0, endTime: (wp.time || 0) + (wp.duration || 6),
            choiceData: { target: wp.target, label: wp.label || 'waypoint', transition: wp.transition, __waypoint: true }
          };
          wpMesh.visible = false;
          attachProgressRing(wpMesh);
          overlaysGroup.add(wpMesh);
          activeChoices.push(wpMesh);
        }
      }

      // "Hear again" replay button (spec ID:01_12C) — present whenever this node
      // has a narration clip, from the moment it starts playing.
      if (node.narration && node.narration.file) {
        const hearMesh = createTextPlane('🔊 Hør igen', {
          width: 380, height: 120, fontSize: 34, backgroundColor: 'rgba(17,24,39,0.75)',
          textColor: 'white', fontWeight: '600', scale: 0.65
        });
        positionMeshFromXY(hearMesh, 12, 96, 5.5);
        hearMesh.userData = {
          isOverlay: true, startTime: node.narration.startTime || 0, endTime: Infinity,
          isChoice: true, choiceData: { __hearAgain: true, label: 'hear_again' }
        };
        hearMesh.visible = false;
        attachProgressRing(hearMesh);
        overlaysGroup.add(hearMesh);
        activeChoices.push(hearMesh);
      }

      // Reset to full size for every node; only shrunk below if this node's
      // question/choices block actually reaches far enough down to crowd the
      // Play gate's fixed, exit-safe resting spot (PLAY_GATE_PCT_Y).
      playGateScale = 1;

      if (node.question || (node.choices && node.choices.length > 0)) {
        const qGroup = new THREE.Group();
        const scale = node.questionScale || 1;
        // Matches the exit affordance's own positionMeshFromXY(50, 96, 5.5) call
        // below — kept as one constant so the two can't quietly drift apart.
        const EXIT_PCT_Y = 96;

        // Boxes are stacked top-to-bottom using each one's REAL rendered height
        // (createTextPlane measures the actual wrapped text and reports it back
        // via userData.boxHeight) instead of a guessed fixed step. A fixed step
        // is what let long answer text spill out of — or visually merge into —
        // its neighbour: short text and six-line text used to consume the same
        // vertical slot. cursorTop tracks where the TOP edge of the next box
        // belongs; lowestBottomEdge is the furthest down anything has reached,
        // used below to guarantee the whole block can never reach the exit
        // button, no matter how much text or how many choices a scenario has.
        const GAP = 0.09;
        let cursorTop = 0;
        let lowestBottomEdge = 0;

        if (node.question) {
          // height:150 is a floor, not a cap — createTextPlane grows it for any
          // question that actually needs more room. The old fixed 256 reserved
          // enough vertical space for ~3 lines even for a one-line question,
          // which is exactly the wasted headroom that squeezed answer choices
          // toward (and, with enough of them, past) the exit affordance below.
          const qMesh = createTextPlane(node.question, {
            width: 1024, height: 150,
            fontSize: node.questionFontSize ? parseFloat(node.questionFontSize) : 50,
            backgroundColor: 'rgba(17, 24, 39, 0.9)', textColor: 'white',
            fontWeight: node.questionFontWeight || '700',
            align: node.questionAlign || 'center',
            scale: scale
          });
          const qH = qMesh.userData.boxHeight;
          qMesh.position.set(0, cursorTop - qH / 2, 0);
          qGroup.add(qMesh);
          cursorTop -= qH + GAP;
          lowestBottomEdge = cursorTop + GAP;
        }
        if (node.choices && node.choices.length > 0) {
          node.choices.forEach((choice) => {
            // Answer-option formatting (§5.1): each choice may carry its own bg /
            // text colour and size. Math.max(0.85, ...) is a hard floor on the
            // FINAL size (after combining with the node's overall questionScale)
            // so a gaze target can never end up too small to comfortably hit,
            // regardless of what an author sets — this is the fix for "answers
            // too small to hit", not just a bigger default.
            const authoredScale = choice.scale ? parseFloat(choice.scale) : 1;
            const cScale = Math.max(0.85, authoredScale * scale);
            const cMesh = createTextPlane(choice.label, {
              width: 800, height: 180,
              fontSize: choice.fontSize ? parseFloat(choice.fontSize) : 50,
              backgroundColor: choice.bgColor || 'rgba(9, 105, 218, 0.95)',
              textColor: choice.textColor || 'white',
              fontWeight: choice.fontWeight || 'normal',
              align: choice.align || 'center',
              scale: cScale
            });
            const cH = cMesh.userData.boxHeight;
            cMesh.position.set(0, cursorTop - cH / 2, 0);
            cMesh.userData.isChoice = true;
            cMesh.userData.choiceData = choice;
            attachProgressRing(cMesh);
            qGroup.add(cMesh);
            activeChoices.push(cMesh);
            cursorTop -= cH + GAP;
            lowestBottomEdge = cursorTop + GAP;
          });
        }

        // Hard guarantee (§4.4b): however tall the question + every choice ends
        // up — one long answer, five short ones, any combination an author can
        // build — this block can never grow down far enough to reach the exit
        // affordance. Exit's own position never moves (a learner needs it to
        // stay predictable); instead the content block shrinks uniformly if it
        // would otherwise encroach. In the ordinary case (a question and a
        // couple of short-to-medium answers) this never triggers at all.
        const qPctY = Math.min(node.questionY !== undefined ? parseFloat(node.questionY) : 50, 80);
        const ARC_DEG = 50, EXIT_MARGIN_DEG = 3, qRadius = 6.5;
        const pitchAtAnchorDeg = (50 - qPctY) / 100 * ARC_DEG;
        const pitchAtExitDeg = (50 - EXIT_PCT_Y) / 100 * ARC_DEG;
        const downwardBudgetDeg = Math.max(0, pitchAtAnchorDeg - (pitchAtExitDeg + EXIT_MARGIN_DEG));
        const downwardBudgetUnits = (downwardBudgetDeg * Math.PI / 180) * qRadius;
        const neededDownwardUnits = -lowestBottomEdge;
        let qGroupFinalScale = 1;
        if (neededDownwardUnits > downwardBudgetUnits && neededDownwardUnits > 0) {
          qGroupFinalScale = Math.max(0.3, downwardBudgetUnits / neededDownwardUnits);
          qGroup.scale.setScalar(qGroupFinalScale);
        }

        // The "Play" gate (shown only if autoplay gets blocked) used to sit at
        // a fixed spot that assumed a short question — fine for a couple of
        // short answers, but an 11-answer question with long text reaches
        // much further down, and the gate could land squarely on top of the
        // answer stack (found via a real stress-test build, not a hypothetical).
        // Compute where THIS block's bottom edge actually ends up, in the same
        // pitch-degree terms as the exit-avoidance math just above. The gate
        // itself never moves (that's how it stays exit-safe -- see
        // PLAY_GATE_PCT_Y above); instead it shrinks, like the qGroup does
        // against exit, just enough that its own top edge clears this bottom
        // edge by a one-pctY buffer. Floored at 0.5 so it never shrinks to
        // something ungazeable at the most extreme stress case.
        const effectiveDownwardDeg = (neededDownwardUnits * qGroupFinalScale) / (Math.PI / 180 * qRadius);
        const bottomEdgePctY = qPctY + (effectiveDownwardDeg / ARC_DEG * 100);
        const playGateTopEdgeIfFullSize = PLAY_GATE_PCT_Y - PLAY_GATE_HALF_PCT_Y;
        if (bottomEdgePctY > playGateTopEdgeIfFullSize - 1) {
          playGateScale = Math.max(0.5, Math.min(1,
            (PLAY_GATE_PCT_Y - bottomEdgePctY - 1) / PLAY_GATE_HALF_PCT_Y
          ));
        }

        positionMeshFromXY(qGroup, node.questionX || 50, qPctY, qRadius);
        qGroup.userData = { startTime: node.questionTime || 0, endTime: Infinity, isOverlay: true };
        qGroup.visible = false;
        overlaysGroup.add(qGroup);
      }

      // In-VR exit affordance (§4.4): a gaze target low in the periphery, well away
      // from the answer arc, with a deliberately longer dwell so it can't be tripped
      // by accident. Present on every non-end node so a learner is never trapped.
      // Position (50, 96, 5.5) is intentionally the same EXIT_PCT_Y/EXIT_RADIUS used
      // above to keep the question/choice block clear of this exact spot.
      if (node.type !== 'end') {
        const exitMesh = createTextPlane('✕ Afslut', {
          width: 360, height: 120, fontSize: 40,
          backgroundColor: 'rgba(17,24,39,0.75)', textColor: '#fca5a5', fontWeight: '600', scale: 0.7
        });
        positionMeshFromXY(exitMesh, 50, 96, 5.5);
        exitMesh.userData = { isChoice: true, choiceData: { __exit: true, label: 'exit' }, dwell: Math.max(2.5, currentDwell * 1.5) };
        attachProgressRing(exitMesh);
        overlaysGroup.add(exitMesh);
        activeChoices.push(exitMesh);
      }
    }

    // A radial progress ring drawn on the targeted choice itself (§4.1), so the
    // learner can watch a selection building and look away before it commits. The
    // ring's geometry is regenerated with the current fill angle only for the
    // targeted mesh, so it costs one geometry per frame at most.
    function attachProgressRing(mesh) {
      const geo = new THREE.RingGeometry(0.28, 0.34, 40, 1, 0, 0.0001);
      const mat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(geo, mat);
      ring.name = 'progressRing';
      ring.position.set(0, 0, 0.02);
      ring.visible = false;
      mesh.add(ring);
    }

    // Map the builder's FLAT 16:9 frame to a forward-facing arc.
    // ±45° horizontal / ±25° vertical ≈ 16:9, so authoring is WYSIWYG and
    // everything stays inside the gaze-reachable forward field of view.
    function positionMeshFromXY(mesh, pctX, pctY, radius) {
      pctX = pctX !== undefined ? pctX : 50;
      pctY = pctY !== undefined ? pctY : 50;
      const yaw   = (pctX - 50) / 100 * (Math.PI / 180 * 90); // ±45°
      const pitch = (50 - pctY) / 100 * (Math.PI / 180 * 50); // ±25°
      mesh.position.set(
        radius * Math.sin(yaw) * Math.cos(pitch),
        radius * Math.sin(pitch),
        -radius * Math.cos(yaw) * Math.cos(pitch)
      );
      mesh.lookAt(0, 0, 0);
    }

    // === Selection Logic ===
    function selectChoice(choice) {
      // Retry-play gate is handled before the transition lock.
      if (choice && choice.__retryPlay) {
        clearPlayGate();
        isTransitioning = false;
        updateGazeProgress(0);
        const p = videoElement.play();
        if (p && p.catch) p.catch(() => showPlayGate());
        return;
      }

      // "Hear again" (§1_12C) — replays narration in place, no navigation at all.
      if (choice && choice.__hearAgain) {
        updateGazeProgress(0);
        try { narrationAudio.currentTime = 0; narrationAudio.play(); } catch (e) {}
        return;
      }

      // In-VR exit affordance (§4.4) — instant, no fade: this is a deliberate abort.
      if (choice && choice.__exit) {
        isTransitioning = true;
        endSession();
        return;
      }

      if (isTransitioning) return;
      isTransitioning = true;

      updateGazeProgress(0);

      // Direct vs. smooth transition (spec ID:02_09/02_10): a choice/waypoint can
      // override its node's default; the scenario-wide default is 'smooth'.
      const mode = choice.transition || currentNode.transition || 'smooth';

      let nextNodeId = choice.target || currentNode.defaultNext;
      const goTo = function () {
        const nextNode = sessionData.nodes.find(n => n.id === nextNodeId);
        if (nextNode) {
          // §2.2 — advance currentNode in BOTH branches. Leaving it on the previous
          // node made the render loop keep evaluating that node's timeline and
          // re-fire auto-nav into the end node, writing phantom/duplicate rows.
          currentNode = nextNode;
          loadNode(nextNode);
          if (mode === 'smooth') fadeTo(0, SCENE_FADE_SEC);
          if (nextNode.type === 'end') {
            // Honour the end node's authored duration, falling back to 3s (§2.2).
            const secs = parseFloat(nextNode.duration);
            scheduleEndSession((secs > 0 ? secs : 3) * 1000);
          }
        } else { fadeAndEnd(); }
      };
      if (!nextNodeId) { fadeAndEnd(); return; }
      if (mode === 'smooth') fadeTo(1, SCENE_FADE_SEC, goTo); else goTo();
    }

    // Schedule the end of the run once, after the end node has shown its content.
    // Idempotent: a second call while one is pending is ignored (§2.2).
    function scheduleEndSession(delayMs) {
      if (endTimer || sessionEnding) return;
      endTimer = setTimeout(() => { endTimer = null; fadeAndEnd(); }, delayMs);
    }

    // Fade to black over END_FADE_SEC before actually tearing the session down
    // (spec ID:02_11 — "fade to black" over 3-5s at the very end of a scenario).
    function fadeAndEnd() {
      fadeTo(1, END_FADE_SEC, endSession);
    }

    // Ends the run whether it is a headset session or a flat preview. Idempotent
    // (§2.2): the render loop, the end timer and the exit affordance can all
    // reach here, but the teardown must run exactly once.
    function endSession() {
      if (sessionEnding) return;
      sessionEnding = true;
      if (endTimer) { clearTimeout(endTimer); endTimer = null; }
      if (xrSession) { xrSession.end(); return; }
      if (flatPreview) onSessionEnd();
    }

    // === Render & Interaction Loop ===
    function render() {
      // §2.1 — clamp dt. THREE.Clock is reset at the start of each run, but a
      // mid-run interruption (headset lifted off, system menu, backgrounding) still
      // returns the whole gap as one dt on resume. Clamping to MAX_DT guarantees no
      // single frame can advance the timeline by more than a frame's worth of time,
      // so content in the middle of a run can never be silently skipped.
      const dt = Math.min(clock.getDelta(), MAX_DT);
      let currentTime = 0;

      // Re-checked every frame (cheap: a couple of booleans + mesh.visible sets) rather
      // than only at the call sites that change stereo/visibility state, because
      // renderer.xr.isPresenting can flip asynchronously relative to when a video
      // actually starts playing — this makes the mesh selection self-correcting
      // regardless of that timing.
      syncStereoVisibility();

      if (currentNode) {
        const nodeHasVideo = !!currentNode.video;

        // §4.2/§4.3 — hold the node timeline at 0 until the video has produced a real
        // first frame (readyState >= HAVE_CURRENT_DATA). Starting the clock earlier
        // ran timed overlays over a black, still-buffering sphere and could auto-skip
        // a node before its clip ever played. A generous timeout declares a genuinely
        // broken clip failed rather than hanging forever.
        if (nodeHasVideo && !videoReady && !videoFailed) {
          if ((performance.now() - videoLoadStart) / 1000 > VIDEO_LOAD_TIMEOUT) {
            markVideoFailed();  // faster path when frames are flowing; timer is the backstop
          } else {
            // Still buffering: keep the timeline frozen, show the loading indicator,
            // but keep the render + gaze loop alive so the play gate stays usable.
            showLoading(true);
            handleGazeInteractions(dt);
            fallbackEnvironment.rotation.y += dt * 0.05;
            renderer.render(scene, camera);
            return;
          }
        }
        if (videoReady) showLoading(false);

        // ---- MONOTONIC SCENARIO CLOCK ----
        // The clock is advanced by deltas and can only move forward: the video drives
        // it while it genuinely progresses, and wall-clock takes over the moment it
        // stalls, so a stalled/reset decoder can neither freeze nor rewind the
        // timeline. (The old code read videoElement.currentTime as absolute truth.)
        const hasVideo = nodeHasVideo && videoElement.readyState > 0;
        let advanced = 0;
        if (hasVideo && !videoElement.ended && !videoElement.paused) {
          const vt = videoElement.currentTime;
          if (vt > lastVideoTime + 0.001) { advanced = vt - lastVideoTime; videoStalledFor = 0; }
          else { videoStalledFor += dt; }
          lastVideoTime = vt;
        } else {
          videoStalledFor += dt;   // no video, blocked, stalled or past the end
        }

        if (advanced > 0) nodeTimer += advanced;
        else if (videoStalledFor > VIDEO_STALL_GRACE) nodeTimer += dt;

        // The clip is running now, so the manual play gate has done its job.
        if (advanced > 0) clearPlayGate();

        currentTime = nodeTimer;

        // Toggle overlay visibility along the timeline
        overlaysGroup.children.forEach(child => {
          if (child.userData.isOverlay && child.userData.startTime !== undefined) {
            child.visible = currentTime >= child.userData.startTime && currentTime <= child.userData.endTime;
          }
        });

        // Narration (§1_12A/B) — fires once, at its authored start time.
        if (!narrationPlayed && currentNode.narration && currentNode.narration.file &&
            currentTime >= (currentNode.narration.startTime || 0)) {
          narrationPlayed = true;
          try { narrationAudio.currentTime = 0; narrationAudio.play(); } catch (e) {}
        }

        // Auto-advance / terminate. The always-present exit affordance, waypoints and
        // the "hear again" button must NOT count as a pending answer, or a node could
        // never auto-advance while any of them are on screen (§4.4, §1_13, §1_12C).
        const choicesPending = activeChoices.some(c => c.userData.choiceData &&
          !(c.userData.choiceData.__exit || c.userData.choiceData.__waypoint || c.userData.choiceData.__hearAgain));

        // Termination: a video node ends on the real 'ended' event (or, for a video
        // whose duration is unknown, never on a duration fallback — §4.3); a non-video
        // node ends when its authored duration elapses.
        let ended;
        if (nodeHasVideo && !videoFailed) {
          const vdur = videoElement.duration;
          ended = videoElement.ended || (isFinite(vdur) && vdur > 0 && currentTime >= vdur);
        } else {
          ended = currentTime >= (parseFloat(currentNode.duration) || 10);
        }

        if (!choicesPending && ended) {
          if (currentNode.defaultNext) {
            selectChoice({ target: currentNode.defaultNext }); // self-guards via isTransitioning
          } else if (!isTransitioning) {
            isTransitioning = true; // terminal node, no link → end instead of freezing
            fadeAndEnd();
          }
        }
      }

      tickFade(dt);
      handleGazeInteractions(dt);
      fallbackEnvironment.rotation.y += dt * 0.05;
      renderer.render(scene, camera);
    }

    function getVisibleChoices() {
      return activeChoices.filter(c => c.visible && (c.parent ? c.parent.visible : true));
    }

    function handleGazeInteractions(dt) {
      const visibleChoices = getVisibleChoices();

      // (Re)arm whenever a choice appears that was not visible last frame (§4.1).
      // Keyed on each mesh, so the answer choices appearing at questionTime re-arm
      // even though the exit affordance was already on screen.
      let appeared = false;
      visibleChoices.forEach(c => { if (!c.userData._wasVisible) appeared = true; });
      activeChoices.forEach(c => { c.userData._wasVisible = false; });
      visibleChoices.forEach(c => { c.userData._wasVisible = true; });

      if (visibleChoices.length === 0) {
        armed = false; armTimer = 0; preArmedChoice = null;
        gazeTimer = 0; lastIntersectedChoice = null;
        updateGazeProgress(0);
        return;
      }
      if (appeared) { armed = false; armTimer = 0; preArmedChoice = null; gazeTimer = 0; }

      // Robust gaze ray: straight out of the camera's world orientation (XR-safe,
      // no NDC/projection assumptions). recursive=false so progress rings (children
      // of the choice meshes) are never the hit target.
      camera.getWorldPosition(_gazeOrigin);
      camera.getWorldQuaternion(_gazeQuat);
      _gazeDir.set(0, 0, -1).applyQuaternion(_gazeQuat).normalize();
      raycaster.set(_gazeOrigin, _gazeDir);
