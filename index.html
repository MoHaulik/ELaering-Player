      const intersects = raycaster.intersectObjects(visibleChoices, false);
      const intersectedChoice = intersects.length > 0 ? intersects[0].object : null;

      // Arming delay: choices are not yet selectable. A gaze may rest here, but the
      // dwell timer does not start until arming completes.
      if (!armed) {
        armTimer += dt;
        lastIntersectedChoice = intersectedChoice;
        gazeTimer = 0;
        if (armTimer >= GAZE_ARM_DELAY) {
          armed = true;
          // A choice already under the reticle at the instant of arming is "locked":
          // it must be looked away from and re-entered before it can be selected.
          preArmedChoice = intersectedChoice || null;
        }
        updateGazeProgress(0, intersectedChoice);
        return;
      }

      // Release the re-entry lock as soon as the gaze moves off the locked choice.
      if (preArmedChoice && intersectedChoice !== preArmedChoice) preArmedChoice = null;

      if (intersectedChoice && intersectedChoice !== preArmedChoice) {
        const threshold = intersectedChoice.userData.dwell || currentDwell;
        if (lastIntersectedChoice === intersectedChoice) {
          gazeTimer = Math.min(threshold, gazeTimer + dt);
          updateGazeProgress(gazeTimer / threshold, intersectedChoice);
          if (gazeTimer >= threshold) selectChoice(intersectedChoice.userData.choiceData);
        } else {
          gazeTimer = 0;
          lastIntersectedChoice = intersectedChoice;
          updateGazeProgress(0, intersectedChoice);
        }
      } else {
        // No choice, or still resting on the locked pre-armed choice.
        gazeTimer = 0;
        lastIntersectedChoice = intersectedChoice;
        updateGazeProgress(0, null);
      }
    }

    function updateGazeProgress(progress, targetMesh = null) {
      const p = Math.max(0, Math.min(1, progress));
      const progressIndicator = reticle.getObjectByName('gazeProgress');
      if (progressIndicator) {
        const s = Math.max(0.001, p);
        progressIndicator.scale.set(s, s, s);
      }
      activeChoices.forEach(child => {
        if (child.material && child.material.color) {
          if (child.userData.originalColor === undefined) child.userData.originalColor = child.material.color.getHex();
          child.material.color.setHex(child === targetMesh ? 0x3b82f6 : child.userData.originalColor);
        }
        // Radial fill on the targeted choice itself (§4.1) — an unmistakable cue that
        // a selection is building, so the learner can look away in time.
        const ring = child.getObjectByName ? child.getObjectByName('progressRing') : null;
        if (ring) {
          if (child === targetMesh && p > 0.001) {
            ring.visible = true;
            if (ring.geometry) ring.geometry.dispose();
            ring.geometry = new THREE.RingGeometry(0.34, 0.42, 44, 1, Math.PI / 2, -p * Math.PI * 2);
          } else {
            ring.visible = false;
          }
        }
      });
    }

    // === Media Generators ===
    function clearOverlays() {
      while (overlaysGroup.children.length > 0) {
        const child = overlaysGroup.children[0];
        overlaysGroup.remove(child);
        if (child.type === 'Group') child.children.forEach(c => disposeNode(c));
        else disposeNode(child);
      }
      activeChoices = [];
      gazeTimer = 0;
      lastIntersectedChoice = null;
    }

    function disposeNode(child) {
      // Choices carry a progressRing child (§4.1); dispose the whole subtree so a
      // long run stepping through many nodes doesn't leak ring geometry/materials.
      if (child.children) child.children.slice().forEach(disposeNode);
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (child.material.map) child.material.map.dispose();
        child.material.dispose();
      }
    }

    function createImagePlane(url, options = {}) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        img.onload = () => {
          const aspect = img.width / img.height;
          const baseWidth = 4;
          const scale = options.scale || 1;
          const geo = new THREE.PlaneGeometry(baseWidth * aspect * scale, baseWidth * scale);
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
          resolve(new THREE.Mesh(geo, mat));
        };
        img.onerror = () => resolve(null);
      });
    }

    // Matterport-style waypoint marker: a floating circular disc with a
    // directional chevron, not the rectangular text button used for other
    // choices — this is a distinct navigation affordance and should read as
    // one at a glance, even before the gaze-dwell ring starts filling.
    function createWaypointMarker(label) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const cx = size / 2, cy = size / 2;

      // Soft outer halo, then the solid disc, then a thin dark ring so the
      // disc reads clearly against both bright and dark video backgrounds.
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.47, 0, Math.PI * 2);
      const halo = ctx.createRadialGradient(cx, cy, size * 0.30, cx, cy, size * 0.47);
      halo.addColorStop(0, 'rgba(255,255,255,0.35)');
      halo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = halo;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fill();
      ctx.lineWidth = size * 0.018;
      ctx.strokeStyle = 'rgba(17,24,39,0.85)';
      ctx.stroke();

      // Upward chevron — the "step forward here" cue Matterport uses on its floor dots.
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      const a = size * 0.115;
      ctx.moveTo(cx, cy - a);
      ctx.lineTo(cx + a * 0.95, cy + a * 0.65);
      ctx.lineTo(cx + a * 0.35, cy + a * 0.65);
      ctx.lineTo(cx + a * 0.35, cy + a * 1.35);
      ctx.lineTo(cx - a * 0.35, cy + a * 1.35);
      ctx.lineTo(cx - a * 0.35, cy + a * 0.65);
      ctx.lineTo(cx - a * 0.95, cy + a * 0.65);
      ctx.closePath();
      ctx.fill();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const geo = new THREE.CircleGeometry(0.42, 48);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
      const disc = new THREE.Mesh(geo, mat);
      disc.userData.__baseScale = 1;

      // A short caption below the disc — Matterport shows this as a hover
      // tooltip, but gaze-based VR has no hover state, so it stays visible
      // whenever the marker is, kept small so it doesn't compete with the disc.
      if (label) {
        const labelMesh = createTextPlane(label, {
          width: 360, height: 90, fontSize: 30, backgroundColor: 'rgba(17,24,39,0.72)',
          textColor: 'white', fontWeight: '600', scale: 0.5
        });
        labelMesh.position.set(0, -0.62, 0.01);
        disc.add(labelMesh);
      }

      return disc;
    }

    // Composes a plain #rrggbb (the Builder's <input type=color> has no alpha
    // channel of its own) with an author-set 0-100 opacity into a real rgba()
    // string — see the textOverlays comment above for why this exists.
    function hexToRgba(hex, alphaPct) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!m) return `rgba(255,255,255,${(alphaPct != null ? alphaPct : 90) / 100})`;
      const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
      return `rgba(${r},${g},${b},${(alphaPct != null ? alphaPct : 90) / 100})`;
    }

    function createTextPlane(text, options = {}) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const logicWidth = options.width || 512;
      const minHeight = options.height || 128;
      const fontSize = options.fontSize || 32;
      const fontWeight = options.fontWeight || 'normal';
      const pixelRatio = 3;
      const padding = 20;

      // Wrap against the authored width FIRST, on the canvas's default (pre-resize)
      // context, so the actual line count is known before we ever decide how tall
      // to make the background — measureText reports logical units regardless of
      // any later ctx.scale, so measuring now and drawing after resizing stays
      // consistent. This is the actual fix for backgrounds not scaling with text:
      // the old code always drew a fixed-height box and let long text (a multi-
      // line narration caption, a long answer) spill out past its own edges.
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const words = String(text).split(' ');
      let lines = [], line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > logicWidth - padding * 2 && n > 0) { lines.push(line); line = words[n] + ' '; }
        else line = testLine;
      }
      lines.push(line);
      const lineHeight = fontSize * 1.3;
      // Never shrink below the caller's nominal height (a one-word answer still
      // gets a comfortable minimum button size) but always grow to fit however
      // many lines the actual text needs.
      const logicHeight = Math.max(minHeight, lines.length * lineHeight + padding * 2.6);

      // Resizing the canvas resets its entire 2D context (font, transform,
      // everything) — this has to happen after measuring above, and font/align
      // have to be reapplied below, or every draw call after the first would
      // silently fall back to default (serif, black, left-aligned) text.
      canvas.width = logicWidth * pixelRatio;
      canvas.height = logicHeight * pixelRatio;
      ctx.scale(pixelRatio, pixelRatio);

      const textColor = options.textColor || 'white';
      const backgroundColor = options.backgroundColor || 'rgba(0,0,0,0.5)';
      const scale = options.scale || 1;

      ctx.fillStyle = backgroundColor;
      ctx.beginPath();
      const radius = 16;
      ctx.moveTo(radius, 0);
      ctx.lineTo(logicWidth - radius, 0);
      ctx.quadraticCurveTo(logicWidth, 0, logicWidth, radius);
      ctx.lineTo(logicWidth, logicHeight - radius);
      ctx.quadraticCurveTo(logicWidth, logicHeight, logicWidth - radius, logicHeight);
      ctx.lineTo(radius, logicHeight);
      ctx.quadraticCurveTo(0, logicHeight, 0, logicHeight - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      // Spec ID:01_14A: the frame around an information-text overlay. Opt-in
      // (only text overlays pass this) so choice buttons, the exit affordance,
      // and every other createTextPlane caller keep their existing look.
      if (options.border) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = options.border;
        ctx.stroke();
      }

      // Optional horizontal alignment (§5.1); defaults to centre so existing
      // scenarios render unchanged.
      const align = (options.align === 'left' || options.align === 'right') ? options.align : 'center';
      const anchorX = align === 'left' ? padding : (align === 'right' ? logicWidth - padding : logicWidth / 2);
      ctx.fillStyle = textColor;
      ctx.font = `${fontWeight} ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      const startY = (logicHeight - (lines.length - 1) * lineHeight) / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i].trim(), anchorX, startY + (i * lineHeight));

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const geometry = new THREE.PlaneGeometry((logicWidth / 256) * scale, (logicHeight / 256) * scale);
      const mesh = new THREE.Mesh(geometry, material);
      // Exposed so callers stacking multiple boxes (the question + each choice)
      // can space them using the box's REAL rendered height, not a guess.
      mesh.userData.boxWidth = (logicWidth / 256) * scale;
      mesh.userData.boxHeight = (logicHeight / 256) * scale;
      return mesh;
    }

    function updateStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.style.display = 'block';
      statusElement.style.background = isError ? 'rgba(220, 38, 38, 0.95)' : 'rgba(17, 24, 39, 0.9)';
      setTimeout(() => { statusElement.style.display = 'none'; }, isError ? 5000 : 3000);
    }

    init();
  </script>
</body>
</html>
